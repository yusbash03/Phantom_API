# Render Blueprint for the PHANTOM API (design §13). Secrets are marked `sync: false`: Render asks for them when
# the Blueprint is created; they are never stored in this file. See docs/deployment.md.
services:
  - type: web
    name: phantom-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # pre-deploy (migration) commands need a paid instance type
    region: frankfurt
    healthCheckPath: /health/ready
    # Release step: apply migrations with the database owner role before the new version takes traffic.
    preDeployCommand: ./efbundle --connection "$MIGRATIONS_CONNECTION_STRING"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Phantom          # runtime role (no UPDATE/DELETE on audit_logs)
        sync: false
      - key: MIGRATIONS_CONNECTION_STRING        # owner role, used only by the release step
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Ai__ApiKey
        sync: false
      - key: Mapbox__AccessToken
        sync: false
      - key: Storage__Provider
        value: S3
      - key: Storage__S3__ServiceUrl             # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: Storage__S3__Bucket
        sync: false
      - key: Storage__S3__AccessKeyId
        sync: false
      - key: Storage__S3__SecretAccessKey
        sync: false
      - key: Cors__AllowedOrigins__0             # the Vercel site, e.g. https://phantom.vercel.app
        sync: false
      - key: AllowedHosts                        # e.g. phantom-api.onrender.com
        sync: false
      - key: ForwardedHeaders__TrustPlatformProxy
        value: "true"
      - key: Database__MigrateOnStartup
        value: "false"
      - key: Seed__Enabled
        value: "false"
