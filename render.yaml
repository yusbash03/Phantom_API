# Render Blueprint for the PHANTOM API (design §13). Secrets are marked `sync: false`: Render asks for them when
# the Blueprint is created; they are never stored in this file. See docs/deployment.md.
services:
  - type: web
    name: phantom-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free plan for now: it sleeps after ~15 minutes without traffic (see docs/deployment.md, "Keeping the free
    # instance awake") and cannot run pre-deploy commands, so migrations are applied by hand before each deploy.
    plan: free
    # --- Starter plan (paid, ~$7/month): automatic migrations, no sleeping. To switch back, replace `plan: free`
    # --- above with the line below, uncomment `preDeployCommand` and the MIGRATIONS_CONNECTION_STRING variable.
    # plan: starter
    region: frankfurt          # same city as the production Neon database (aws-eu-central-1); storage is in eu-west-1
    healthCheckPath: /health/ready
    # Release step (Starter plan only): apply migrations with the database owner role before the new version takes traffic.
    # preDeployCommand: ./efbundle --connection "$MIGRATIONS_CONNECTION_STRING"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Phantom          # runtime role (no UPDATE/DELETE on audit_logs)
        sync: false
      # - key: MIGRATIONS_CONNECTION_STRING      # Starter plan only: owner role, used only by the release step
      #   sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Ai__ApiKey
        sync: false
      - key: Mapbox__AccessToken
        sync: false
      - key: Storage__Provider
        value: S3
      - key: Storage__S3__ServiceUrl             # Supabase: https://<project-ref>.supabase.co/storage/v1/s3
        sync: false
      - key: Storage__S3__Region                 # Supabase: the project's region (eu-west-1 for phantom_files)
        sync: false
      - key: Storage__S3__Bucket
        sync: false
      - key: Storage__S3__AccessKeyId
        sync: false
      - key: Storage__S3__SecretAccessKey
        sync: false
      - key: Cors__AllowedOrigins__0             # the Vercel site: https://phantom-ui-two.vercel.app
        sync: false
      - key: AllowedHosts                        # phantom-api-xnkr.onrender.com
        sync: false
      - key: ForwardedHeaders__TrustPlatformProxy
        value: "true"
      - key: Database__MigrateOnStartup
        value: "false"
      - key: Seed__Enabled
        value: "false"
      - key: OpenApi__ExposeUi                   # public API reference at /scalar (and /swagger); set "false" to hide
        value: "true"
